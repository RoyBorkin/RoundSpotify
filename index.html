<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circular Music Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark: #121212;
            --light: #FFFFFF;
            
            /* Brand Colors */
            --spotify: #1DB954;
            --apple: #FA243C;
            --youtube: #FF0000;
            --soundcloud: #FF5500;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            user-select: none; 
        }

        #remote-container {
            width: 98vmin; 
            height: 98vmin;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--light);
        }

        .header-text {
            text-align: center;
            margin-bottom: 8vmin;
            z-index: 10;
        }

        .header-text h1 {
            font-size: 3.5vmin;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-text p {
            font-size: 1.5vmin;
            color: #888;
            margin-top: 1vmin;
        }

        /* --- SERVICES GRID --- */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4vmin;
            z-index: 10;
        }

        .service-btn {
            width: 22vmin;
            height: 22vmin;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--light);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .service-btn i {
            font-size: 6vmin;
            margin-bottom: 1.5vmin;
            transition: all 0.3s ease;
        }

        .service-btn span {
            font-size: 1.8vmin;
            font-weight: 700;
            opacity: 0.8;
        }

        /* Hover Effects */
        .service-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.08);
        }

        .service-btn.spotify:hover {
            border-color: var(--spotify);
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.4);
        }
        .service-btn.spotify:hover i, .service-btn.spotify:hover span { color: var(--spotify); opacity: 1; }

        .service-btn.apple:hover {
            border-color: var(--apple);
            box-shadow: 0 0 30px rgba(250, 36, 60, 0.4);
        }
        .service-btn.apple:hover i, .service-btn.apple:hover span { color: var(--apple); opacity: 1; }

        .service-btn.youtube:hover {
            border-color: var(--youtube);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }
        .service-btn.youtube:hover i, .service-btn.youtube:hover span { color: var(--youtube); opacity: 1; }

        .service-btn.soundcloud:hover {
            border-color: var(--soundcloud);
            box-shadow: 0 0 30px rgba(255, 85, 0, 0.4);
        }
        .service-btn.soundcloud:hover i, .service-btn.soundcloud:hover span { color: var(--soundcloud); opacity: 1; }


        /* --- MODAL FOR UNAVAILABLE SERVICES --- */
        #coming-soon-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #coming-soon-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        #coming-soon-modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-icon {
            font-size: 5vmin;
            margin-bottom: 2vmin;
            color: #888;
        }

        .modal-content h2 {
            font-size: 3.5vmin;
            margin: 0 0 1vmin 0;
        }

        .modal-content p {
            font-size: 1.8vmin;
            color: #aaa;
            margin-bottom: 4vmin;
            max-width: 60vmin;
        }

        .close-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 1.5vmin 4vmin;
            border-radius: 30px;
            font-size: 1.8vmin;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .close-btn:hover {
            background: white;
            color: black;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="remote-container">
        <div class="ambient-glow"></div>

        <div class="header-text">
            <h1>Select Service</h1>
            <p>Choose your music universe</p>
        </div>

        <div class="services-grid">
            <!-- Spotify connects to your landing page -->
            <a href="spotifyround.html" class="service-btn spotify">
                <i class="fab fa-spotify"></i>
                <span>Spotify</span>
            </a>

            <!-- Other services trigger the 'coming soon' modal -->
            <div class="service-btn apple" onclick="showModal('Apple Music', 'fa-apple', 'var(--apple)')">
                <i class="fab fa-apple"></i>
                <span>Apple Music</span>
            </div>

            <div class="service-btn youtube" onclick="showModal('YouTube Music', 'fa-youtube', 'var(--youtube)')">
                <i class="fab fa-youtube"></i>
                <span>YouTube Music</span>
            </div>

            <div class="service-btn soundcloud" onclick="showModal('SoundCloud', 'fa-soundcloud', 'var(--soundcloud)')">
                <i class="fab fa-soundcloud"></i>
                <span>SoundCloud</span>
            </div>
        </div>

        <!-- Custom Modal Overlay inside the circle -->
        <div id="coming-soon-modal">
            <div class="modal-content">
                <i id="modal-icon" class="fab fa-apple modal-icon"></i>
                <h2>Coming Soon</h2>
                <p>The <span id="modal-service-name" style="font-weight: bold; color: white;"></span> integration is currently in development. Please select Spotify for the full experience.</p>
                <button class="close-btn" onclick="closeModal()">Go Back</button>
            </div>
        </div>

    </div>

    <script>
        function showModal(serviceName, iconClass, color) {
            const modal = document.getElementById('coming-soon-modal');
            const nameSpan = document.getElementById('modal-service-name');
            const icon = document.getElementById('modal-icon');
            
            // Update modal content dynamically based on the clicked button
            nameSpan.innerText = serviceName;
            
            // Reset and assign the correct icon classes
            icon.className = `fab ${iconClass} modal-icon`;
            icon.style.color = color;

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('coming-soon-modal');
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
