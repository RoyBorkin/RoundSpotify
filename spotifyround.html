<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotify Circular Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1DB954;
            --primary-hover: #1ed760;
            --dark: #191414;
            --light: #FFFFFF;
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
        }

        /* STRICTLY PRESERVED FRAME PARAMETERS */
        #remote-container {
            width: 98vmin; 
            height: 98vmin;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(29, 185, 84, 0.2), inset 0 0 20px rgba(255,255,255,0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: calc(10px + 1vmin); 
            background: #000;
        }

        /* --- STANDARD BACKGROUND --- */
        #bg-image {
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%; /* Slightly larger to hide blurred edges */
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.5) saturate(1.2);
            z-index: 1;
            transition: opacity 0.8s ease, background-image 0.8s ease;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10% 0 8% 0;
            box-sizing: border-box;
            color: var(--light);
            transition: all 0.5s ease;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
        }

        /* --- TOP BUTTONS --- */
        .top-controls {
            display: flex;
            gap: 15px;
            z-index: 20; 
            order: 1;
            position: relative;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            width: 3em;
            height: 3em;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 1em;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-secondary:hover, .btn-secondary.active {
            background: var(--primary);
            border-color: var(--primary-hover);
            color: var(--dark);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 5px 20px rgba(29, 185, 84, 0.4);
        }

        /* --- SONG INFO --- */
        .song-info {
            text-align: center;
            width: 80%;
            margin: auto 0;
            transition: all 0.5s ease;
            order: 2; 
            position: relative;
            z-index: 10;
            padding: 15px 20px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        #track-name {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 0.2em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: -0.5px;
        }

        #artist-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #ccc;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        /* --- CONTROLS SECTION --- */
        .bottom-section {
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            order: 3;
            position: relative;
            z-index: 10;
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            margin-top: 20px; 
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--light);
            font-size: 1.4em;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .btn-control:hover { 
            opacity: 1; 
            transform: scale(1.15); 
            color: var(--primary-hover);
        }

        .btn-play {
            font-size: 2em;
            background: var(--light);
            color: var(--dark);
            width: 2.2em;
            height: 2.2em;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            opacity: 1;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-play:hover {
            transform: scale(1.1);
            background: var(--primary);
            color: var(--light);
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.4);
        }

        /* --- PROGRESS BAR --- */
        .progress-wrapper {
            width: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 0.85em;
            font-weight: 600;
            color: #bbb;
            transition: opacity 0.3s;
        }

        input[type=range] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 6px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 10px; outline: none;
            cursor: pointer;
            position: relative;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; 
            border-radius: 50%; background: var(--light); 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.3);
            background: var(--primary);
        }

        /* --- VINYL MODE STYLES --- */
        #vinyl-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vmin; height: 100vmin;
            border-radius: 50%;
            z-index: 5; 
            display: none; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            cursor: grab;
        }

        #vinyl-wrapper:active { cursor: grabbing; }

        .vinyl-disk {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle, #111 25%, transparent 26%),
                repeating-radial-gradient(#111 0, #111 2px, #222 3px, #111 4px);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.15), 0 0 20px rgba(0,0,0,0.8);
        }

        .vinyl-label {
            width: 35%; height: 35%;
            border-radius: 50%;
            background-size: cover; background-position: center;
            position: absolute;
            box-shadow: 0 0 0 2px #000, 0 0 0 6px #222; 
            pointer-events: none; 
            background-color: #333;
        }
        
        .vinyl-label::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 16px; height: 16px;
            background: #111; border-radius: 50%;
            border: 2px solid #ccc;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        #tone-arm {
            position: absolute; top: 0; right: 15%;
            width: 6vmin; height: 60vmin;
            transform-origin: 50% 10%;
            z-index: 8; pointer-events: none;
            transition: transform 0.1s linear; 
            display: none; 
            filter: drop-shadow(10px 10px 15px rgba(0,0,0,0.7));
        }

        .pivot {
            width: 8vmin; height: 8vmin;
            background: radial-gradient(circle at 30% 30%, #888, #333);
            border-radius: 50%; border: 3px solid #222;
            position: absolute; top: 5%; left: -1vmin;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .arm-rod {
            width: 1.2vmin; height: 48vmin;
            background: linear-gradient(90deg, #999, #fff, #777);
            position: absolute; top: 10%; left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .headshell {
            width: 3.5vmin; height: 7vmin;
            background: linear-gradient(135deg, #333, #111);
            position: absolute; bottom: 32%; left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        
        /* --- UI MODIFICATIONS FOR VINYL MODE --- */
        .vinyl-mode #bg-image { opacity: 0.1; filter: blur(30px); }
        .vinyl-mode #vinyl-wrapper { display: block; order: 2; }
        .vinyl-mode #tone-arm { display: block; }
        .vinyl-mode .song-info { order: 4; margin-top: 10px; background: transparent; border: none; backdrop-filter: none; }
        .vinyl-mode .bottom-section { order: 5; margin-bottom: 0px; }
        .vinyl-mode .progress-wrapper { display: none; }
        .vinyl-mode .hide-on-vinyl { display: none; }
        .vinyl-mode #ui-layer { justify-content: center; gap: 15px; background: none;}

        /* --- MODALS --- */
        #login-overlay { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: radial-gradient(circle, rgba(29, 185, 84, 0.2) 0%, rgba(0,0,0,0.95) 70%); 
            z-index:100; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; 
        }
        
        #login-overlay h2 { font-weight: 800; font-size: 2.5em; margin-bottom: 10px;}
        
        .login-btn { 
            background-color: var(--primary); color: white; border: none; 
            padding: 15px 40px; border-radius: 40px; font-size: 1.2rem; font-weight: 800; 
            cursor: pointer; text-transform: uppercase; margin-top: 30px; letter-spacing: 1px;
            transition: all 0.3s; box-shadow: 0 10px 30px rgba(29, 185, 84, 0.3); font-family: 'Inter', sans-serif;
        }
        
        .login-btn:hover { background-color: var(--primary-hover); transform: translateY(-3px); box-shadow: 0 15px 40px rgba(29, 185, 84, 0.5); }

        .modal { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; 
            padding: 20px; box-sizing: border-box; color: white; opacity: 0; transition: opacity 0.3s ease;
        }
        
        .modal.active { display: flex; opacity: 1; }
        .modal h3 { font-size: 1.8em; margin-bottom: 20px; letter-spacing: 1px; color: var(--primary); }

        .list-container { 
            width: 70%; height: 50%; overflow-y: auto; text-align: center; 
            background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid var(--glass-border);
            padding: 10px;
        }
        
        /* Custom Scrollbar */
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-track { background: transparent; }
        .list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .list-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        .list-item { 
            padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            cursor: pointer; font-size: 1.1em; color: #ddd; transition: all 0.2s;
            border-radius: 10px; margin-bottom: 5px;
        }
        
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { color: #fff; background: rgba(255,255,255,0.1); transform: scale(1.02); }
        
        .close-modal { 
            margin-top: 25px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); 
            color: white; padding: 12px 35px; border-radius: 30px; cursor: pointer; 
            font-weight: 600; font-family: 'Inter', sans-serif; transition: all 0.2s;
        }
        .close-modal:hover { background: white; color: black; }

        /* Notification Toast */
        #toast {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 8px 20px;
            border-radius: 20px; font-weight: 600; font-size: 0.9em;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #toast.show { opacity: 1; }

    </style>
</head>
<body>

    <div id="remote-container">
        <div id="bg-image"></div>
        <div id="toast">Message</div>

        <div id="login-overlay">
            <i class="fab fa-spotify" style="font-size: 4em; color: var(--primary); margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(29,185,84,0.5));"></i>
            <h2>Connect Spotify</h2>
            <p style="width: 70%; color: #aaa; line-height: 1.5;">Control your music from this circular display.</p>
            <button class="login-btn" onclick="startAuthFlow()">Login</button>
        </div>

        <div id="ui-layer">
            <div class="top-controls">
                <button class="btn-secondary" onclick="window.location.href='portal.html'" title="Home"><i class="fas fa-home"></i></button>
                <button class="btn-secondary" onclick="openPlaylists()" title="Playlists"><i class="fas fa-list"></i></button>
                <button class="btn-secondary" onclick="openDevices()" title="Devices"><i class="fas fa-desktop"></i></button>
                <button class="btn-secondary" id="vinyl-btn" onclick="toggleVinylMode()" title="Vinyl Mode"><i class="fas fa-compact-disc"></i></button>
            </div>

            <div id="vinyl-wrapper">
                <div class="vinyl-disk" id="vinyl-disk">
                    <div class="vinyl-label" id="vinyl-label"></div>
                </div>
                <div id="tone-arm">
                    <div class="pivot"></div>
                    <div class="arm-rod"></div>
                    <div class="headshell"></div>
                </div>
            </div>

            <div class="song-info">
                <div id="track-name">Not Playing</div>
                <div id="artist-name">Connect a device</div>
            </div>

            <div class="bottom-section">
                <div class="progress-wrapper">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0">
                    <span id="total-time">0:00</span>
                </div>

                <div class="main-controls">
                    <button class="btn-control" onclick="previousTrack()" title="Previous"><i class="fas fa-step-backward"></i></button>
                    <button class="btn-control hide-on-vinyl" onclick="seekRelative(-15000)" title="Rewind 15s"><i class="fas fa-undo"></i></button>
                    
                    <button class="btn-control btn-play" id="play-pause-btn" onclick="togglePlay()">
                        <i class="fas fa-play"></i>
                    </button>
                    
                    <button class="btn-control hide-on-vinyl" onclick="seekRelative(15000)" title="Forward 15s"><i class="fas fa-redo"></i></button>
                    <button class="btn-control" onclick="nextTrack()" title="Next"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>

        <!-- Modals -->
        <div id="playlist-modal" class="modal">
            <h3>Your Playlists</h3>
            <div class="list-container" id="playlist-list">Loading...</div>
            <button class="close-modal" onclick="closeModals()">Close</button>
        </div>

        <div id="device-modal" class="modal">
            <h3>Active Devices</h3>
            <div class="list-container" id="device-list">Loading...</div>
            <button class="close-modal" onclick="closeModals()">Close</button>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const clientId = 'ae4f9dd4cc124d92b33737be4ff31c1f'; // <--- PASTE YOUR ID HERE (ae4f...)
    const redirectUri = window.location.href.split('?')[0]; 
    const scope = "user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative";

    // --- STATE VARIABLES ---
    let isVinylMode = false;
    let isScrubbing = false; 
    let currentProgress = 0;
    let trackDuration = 0;
    let isPlaying = false;
    let lastUpdateTime = 0; 
    
    // Vinyl Variables
    let vinylDisk = document.getElementById('vinyl-disk');
    let vinylWrapper = document.getElementById('vinyl-wrapper');
    let toneArm = document.getElementById('tone-arm');
    let startAngle = 0;
    let currentRotation = 0; 
    let accumulatedSeekMs = 0;

    // --- UTILS ---
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    // --- JS ANIMATION LOOP ---
    function renderLoop(timestamp) {
        if (!lastUpdateTime) lastUpdateTime = timestamp;
        const deltaTime = timestamp - lastUpdateTime;
        lastUpdateTime = timestamp;

        if (isVinylMode) {
            // Spin Logic
            if (isPlaying && !isScrubbing) {
                currentRotation += 0.3; 
                if(trackDuration > 0) {
                    currentProgress += deltaTime; 
                    if(currentProgress > trackDuration) currentProgress = trackDuration;
                }
            }
            vinylDisk.style.transform = `rotate(${currentRotation}deg)`;

            // Tone Arm Logic
            if (trackDuration > 0) {
                const percent = Math.min(1, Math.max(0, currentProgress / trackDuration));
                const armAngle = -25 + (percent * 45); // Adjust arc slightly for better look
                toneArm.style.transform = `rotate(${armAngle}deg)`;
            }
        }
        requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // --- VINYL LOGIC ---
    function toggleVinylMode() {
        isVinylMode = !isVinylMode;
        const container = document.getElementById('remote-container');
        const btn = document.getElementById('vinyl-btn');
        
        if (isVinylMode) {
            container.classList.add('vinyl-mode');
            btn.classList.add('active');
        } else {
            container.classList.remove('vinyl-mode');
            btn.classList.remove('active');
        }
    }

    function getAngle(x, y) {
        const rect = vinylWrapper.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        return Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);
    }

    function startScratch(e) {
        if(!isVinylMode) return;
        isScrubbing = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startAngle = getAngle(clientX, clientY) - currentRotation;
        accumulatedSeekMs = 0; 
    }

    function moveScratch(e) {
        if (!isScrubbing) return;
        e.preventDefault(); 
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const angle = getAngle(clientX, clientY);
        const newRotation = angle - startAngle;
        let delta = newRotation - currentRotation;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;

        currentRotation = newRotation;
        accumulatedSeekMs += (delta * 120); // Multiplier for scratch sensitivity
    }

    async function endScratch() {
        if(!isScrubbing) return;
        isScrubbing = false;
        
        if (Math.abs(accumulatedSeekMs) > 100) {
            const newPos = Math.max(0, currentProgress + accumulatedSeekMs);
            currentProgress = newPos; 
            await fetchApi(`me/player/seek?position_ms=${Math.floor(newPos)}`, 'PUT');
            setTimeout(updateState, 500);
        }
    }

    vinylWrapper.addEventListener('mousedown', startScratch);
    document.addEventListener('mousemove', moveScratch);
    document.addEventListener('mouseup', endScratch);

    vinylWrapper.addEventListener('touchstart', startScratch, {passive: false});
    document.addEventListener('touchmove', moveScratch, {passive: false});
    document.addEventListener('touchend', endScratch);

    // --- AUTH & API ---
    function generateRandomString(length) {
        let text = '';
        const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
        return text;
    }

    async function generateCodeChallenge(codeVerifier) {
        const data = new TextEncoder().encode(codeVerifier);
        const digest = await window.crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)])).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startAuthFlow() {
        const codeVerifier = generateRandomString(128);
        window.localStorage.setItem('code_verifier', codeVerifier);
        const codeChallenge = await generateCodeChallenge(codeVerifier);
        const authUrl = new URL("https://accounts.spotify.com/authorize");
        const params = { response_type: 'code', client_id: clientId, scope: scope, code_challenge_method: 'S256', code_challenge: codeChallenge, redirect_uri: redirectUri };
        authUrl.search = new URLSearchParams(params).toString();
        window.location.href = authUrl.toString();
    }

    async function getToken(code) {
        const codeVerifier = window.localStorage.getItem('code_verifier');
        const payload = { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: clientId, grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, code_verifier: codeVerifier }) };
        const body = await fetch("https://accounts.spotify.com/api/token", payload);
        const response = await body.json();
        if (response.access_token) {
            window.localStorage.setItem('access_token', response.access_token);
            window.localStorage.setItem('refresh_token', response.refresh_token);
            window.history.replaceState({}, document.title, redirectUri);
            document.getElementById('login-overlay').style.display = 'none';
            startPolling();
        } else {
            showToast("Login Failed");
        }
    }

    // NEW: Refresh Token Logic to prevent unexpected logouts
    async function refreshAccessToken() {
        const refreshToken = window.localStorage.getItem('refresh_token');
        if(!refreshToken) return false;
        
        const payload = { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: clientId, grant_type: 'refresh_token', refresh_token: refreshToken }) };
        try {
            const body = await fetch("https://accounts.spotify.com/api/token", payload);
            const response = await body.json();
            if (response.access_token) {
                window.localStorage.setItem('access_token', response.access_token);
                if (response.refresh_token) window.localStorage.setItem('refresh_token', response.refresh_token);
                return true;
            }
        } catch(e) { console.error("Refresh failed", e); }
        return false;
    }

    async function fetchApi(endpoint, method = "GET", body = null) {
        let token = window.localStorage.getItem('access_token');
        if (!token) return;
        const opts = { method: method, headers: { 'Authorization': `Bearer ${token}` } };
        if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
        
        try {
            let res = await fetch(`https://api.spotify.com/v1/${endpoint}`, opts);
            
            // Handle Expired Token
            if (res.status === 401) { 
                const refreshed = await refreshAccessToken();
                if(refreshed) {
                    opts.headers['Authorization'] = `Bearer ${window.localStorage.getItem('access_token')}`;
                    res = await fetch(`https://api.spotify.com/v1/${endpoint}`, opts); // Retry
                } else {
                    window.localStorage.removeItem('access_token'); 
                    window.location.reload(); 
                    return;
                }
            }
            
            if (res.status === 204) return null;
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
        } catch (e) { console.error("API Error:", e); return null; }
    }

    // --- UPDATES ---
    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    async function updateState() {
        if (isScrubbing) return; 

        const data = await fetchApi('me/player');
        if (!data || !data.item) {
            document.getElementById('track-name').innerText = "Not Playing";
            document.getElementById('artist-name').innerText = "Open Spotify on a device";
            return;
        }

        isPlaying = data.is_playing;
        currentProgress = data.progress_ms; 
        trackDuration = data.item.duration_ms;
        const albumImg = data.item.album.images[0].url;

        // UI Updates
        document.getElementById('track-name').innerText = data.item.name;
        document.getElementById('artist-name').innerText = data.item.artists.map(a => a.name).join(', ');
        
        // Backgrounds
        document.getElementById('bg-image').style.backgroundImage = `url(${albumImg})`;
        document.getElementById('vinyl-label').style.backgroundImage = `url(${albumImg})`;

        // Play/Pause Btn
        const playBtn = document.getElementById('play-pause-btn');
        playBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play" style="margin-left: 3px;"></i>';

        // Progress Bar (Standard Mode)
        const progressBar = document.getElementById('progress-bar');
        progressBar.max = trackDuration;
        progressBar.value = currentProgress;
        document.getElementById('current-time').innerText = formatTime(currentProgress);
        document.getElementById('total-time').innerText = formatTime(trackDuration);
    }

    // --- CONTROLS ---
    async function togglePlay() {
        if (isPlaying) await fetchApi('me/player/pause', 'PUT');
        else await fetchApi('me/player/play', 'PUT');
        setTimeout(updateState, 500);
    }
    async function nextTrack() { await fetchApi('me/player/next', 'POST'); setTimeout(updateState, 500); }
    async function previousTrack() { await fetchApi('me/player/previous', 'POST'); setTimeout(updateState, 500); }
    async function seekRelative(amountMs) {
        const newPos = Math.max(0, currentProgress + amountMs);
        await fetchApi(`me/player/seek?position_ms=${newPos}`, 'PUT');
        setTimeout(updateState, 500);
    }

    // Standard Slider Logic
    const progressBar = document.getElementById('progress-bar');
    progressBar.addEventListener('input', (e) => {
        isScrubbing = true;
        document.getElementById('current-time').innerText = formatTime(e.target.value);
    });
    progressBar.addEventListener('change', async (e) => {
        await fetchApi(`me/player/seek?position_ms=${e.target.value}`, 'PUT');
        isScrubbing = false;
        setTimeout(updateState, 1000);
    });

    // Modals
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
    
    async function openPlaylists() {
        closeModals(); document.getElementById('playlist-modal').classList.add('active');
        const list = document.getElementById('playlist-list'); list.innerHTML = "Loading...";
        const data = await fetchApi('me/playlists?limit=30');
        if (!data) { list.innerHTML = "Error loading playlists."; return; }
        
        list.innerHTML = '';
        if(data.items.length === 0) list.innerHTML = "No playlists found.";
        
        data.items.forEach(p => {
            if(!p) return;
            const div = document.createElement('div'); div.className = 'list-item'; div.innerText = p.name;
            div.onclick = async () => { 
                showToast(`Playing ${p.name}...`);
                await fetchApi('me/player/play', 'PUT', { context_uri: p.uri }); 
                closeModals(); setTimeout(updateState, 1000); 
            };
            list.appendChild(div);
        });
    }
    
    async function openDevices() {
        closeModals(); document.getElementById('device-modal').classList.add('active');
        const list = document.getElementById('device-list'); list.innerHTML = "Loading...";
        const data = await fetchApi('me/player/devices');
        if (!data) { list.innerHTML = "Error loading devices."; return; }
        
        list.innerHTML = '';
        if(data.devices.length === 0) list.innerHTML = "No active devices found. Open Spotify app.";
        
        data.devices.forEach(d => {
            const div = document.createElement('div'); div.className = 'list-item'; 
            div.innerHTML = `${d.is_active ? '<i class="fas fa-volume-up" style="color:var(--primary); margin-right:8px;"></i>' : ''}${d.name} <span style="font-size:0.8em; color:#888;">(${d.type})</span>`;
            div.onclick = async () => { 
                showToast(`Connecting to ${d.name}...`);
                await fetchApi('me/player', 'PUT', { device_ids: [d.id] }); 
                closeModals(); setTimeout(updateState, 1000); 
            };
            list.appendChild(div);
        });
    }

    // Start
    async function onPageLoad() {
        const args = new URLSearchParams(window.location.search);
        if (args.get('code')) {
            await getToken(args.get('code'));
        } else if (window.localStorage.getItem('access_token')) {
            document.getElementById('login-overlay').style.display = 'none';
            startPolling();
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
        }
    }

    let pollInterval;
    function startPolling() { 
        updateState(); 
        if(pollInterval) clearInterval(pollInterval); 
        pollInterval = setInterval(updateState, 3000); 
    }
    
    window.onload = onPageLoad;

</script>
</body>
</html>
